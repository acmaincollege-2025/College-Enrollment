<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/template/student_layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="content">

        <!-- ================= WELCOME ================= -->
        <p:panel style="margin-bottom:15px">
            <h:outputText
                value="Welcome, #{studentBean.student.firstname} #{studentBean.student.lastname}"
                style="font-size:18px;font-weight:bold"/>
            <br/>
            <h:outputText value="Student No: #{studentBean.student.studno}"
                          style="color:#666"/>
        </p:panel>

        <!-- ================= STAT CARDS ================= -->
        <h:panelGrid columns="4" cellpadding="10" style="width:100%;margin-bottom:20px">

            <p:panel style="text-align:center">
                <h:outputText value="📘" style="font-size:26px"/>
                <br/>
                <h:outputText value="Enrollments" style="font-weight:bold"/>
                <br/>
                <h:outputText value="#{studentPortalBean.myEnrollments.size()}"/>
            </p:panel>

            <p:panel style="text-align:center">
                <h:outputText value="💳" style="font-size:26px"/>
                <br/>
                <h:outputText value="Payments" style="font-weight:bold"/>
                <br/>
                <h:outputText value="#{paymentBean.paymentHistory.size()}"/>
            </p:panel>

            <p:panel style="text-align:center">
                <h:outputText value="📄" style="font-size:26px"/>
                <br/>
                <h:outputText value="COE Requests" style="font-weight:bold"/>
                <br/>
                <h:outputText value="#{coeBean.coeRequests.size()}"/>
            </p:panel>

            <p:panel style="text-align:center">
                <h:outputText value="⚙️" style="font-size:26px"/>
                <br/>
                <p:commandLink value="Change Password"
                               onclick="PF('pwdDlg').show();return false;"/>
            </p:panel>

        </h:panelGrid>

        <!-- ================= NOTIFICATIONS + CHARTS ================= -->
        <h:panelGrid columns="2" cellpadding="15" style="width:100%;margin-bottom:20px">

            <!-- NOTIFICATIONS -->
            <p:panel header="🔔 Notifications">
                <p:dataList value="#{studentNotificationBean.notifications}"
                            var="n"
                            emptyMessage="No notifications">

                    <h:panelGrid columns="1" style="width:100%">
                        <h:outputText value="#{n.message}"
                                      style="font-weight:bold;
                                      color:#{n.type eq 'SUCCESS' ? 'green' :
                                              n.type eq 'WARN' ? 'orange' : 'blue'}"/>

                        <h:outputText value="#{n.date}" style="font-size:11px;color:#777">
                            <f:convertDateTime pattern="MMM dd, yyyy HH:mm"/>
                        </h:outputText>
                        <hr/>
                    </h:panelGrid>

                </p:dataList>
            </p:panel>

            <!-- CHARTS -->
            <p:panel header="📊 Overview">
                <p:chart type="bar"
                         model="#{studentDashboardBean.enrollmentChart}"
                         style="width:100%;height:220px"/>
                <br/>
                <p:chart type="pie"
                         model="#{studentDashboardBean.paymentChart}"
                         style="width:100%;height:220px"/>
            </p:panel>

        </h:panelGrid>

        <!-- ================= MAIN TABS ================= -->
        <p:tabView>

            <!-- ENROLLMENTS -->
            <p:tab title="📘 My Enrollments">
                <p:dataTable value="#{studentPortalBean.myEnrollments}"
                             var="e"
                             rows="5"
                             emptyMessage="No enrollments found">

                    <p:column headerText="Academic Year">
                        <h:outputText value="#{e.academic_year}"/>
                    </p:column>

                    <p:column headerText="Semester">
                        <h:outputText value="#{e.semester}"/>
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="#{e.status}" style="font-weight:bold"/>
                    </p:column>

                </p:dataTable>
            </p:tab>

            <!-- PAYMENTS -->
            <p:tab title="💳 Payment History">
                <p:dataTable value="#{paymentBean.paymentHistory}"
                             var="pay"
                             rows="5"
                             emptyMessage="No payments recorded">

                    <p:column headerText="Date">
                        <h:outputText value="#{pay.paymentDate}">
                            <f:convertDateTime pattern="MMM dd, yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Amount">
                        <h:outputText value="#{pay.amountPaid}">
                            <f:convertNumber type="currency" currencySymbol="₱"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Reference">
                        <h:outputText value="#{pay.paymentReferenceNumber}"/>
                    </p:column>

                </p:dataTable>
            </p:tab>

            <!-- QUICK ACTIONS -->
            <p:tab title="⚡ Quick Actions">
                <h:panelGrid columns="2" cellpadding="10">
                    <p:commandButton value="✏️ Edit Profile"
                                     action="student-edit?faces-redirect=true"/>
                    <p:commandButton value="📝 Enroll"
                                     action="student-enrollment?faces-redirect=true"/>
                    <p:commandButton value="📊 View Grades"
                                     action="student_grades?faces-redirect=true"/>
                    <p:commandButton value="💰 Payments"
                                     action="payment?faces-redirect=true"/>
                </h:panelGrid>
            </p:tab>

        </p:tabView>

        <!-- ================= COE ================= -->
        <h:form id="coeForm">
            <p:panel header="📄 Certificate of Enrollment" style="margin-top:20px">

                <p:commandButton value="Request COE"
                                 action="#{coeBean.requestCOE}"
                                 update="coeTable messages"/>

                <p:dataTable id="coeTable"
                             value="#{coeBean.coeRequests}"
                             var="req"
                             emptyMessage="No requests yet">

                    <p:column headerText="Requested On">
                        <h:outputText value="#{req.requestDate}">
                            <f:convertDateTime pattern="MMM dd, yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="#{req.status}" style="font-weight:bold"/>
                    </p:column>

                    <p:column headerText="Remarks">
                        <h:outputText value="#{req.remarks}"/>
                    </p:column>

                </p:dataTable>

                <p:messages id="messages" closable="true"/>
            </p:panel>
        </h:form>

        <!-- ================= CHANGE PASSWORD ================= -->
        <p:dialog widgetVar="pwdDlg"
                  header="Change Password"
                  modal="true"
                  resizable="false">

            <h:form id="pwdForm">
                <h:panelGrid columns="2" cellpadding="5">

                    <h:outputLabel value="Current Password"/>
                    <p:password value="#{studentCredentialsBean.currentPassword}"/>

                    <h:outputLabel value="New Password"/>
                    <p:password value="#{studentCredentialsBean.newPassword}"/>

                    <h:outputLabel value="Confirm Password"/>
                    <p:password value="#{studentCredentialsBean.confirmPassword}"/>

                </h:panelGrid>

                <p:commandButton value="Save"
                                 action="#{studentCredentialsBean.changePassword}"
                                 update="@form"
                                 oncomplete="PF('pwdDlg').hide();"/>
            </h:form>
        </p:dialog>
        <f:event type="preRenderView"
                 listener="#{studentLoginBean.loggedInStudent == null
                             ? facesContext.externalContext.redirect('student-login.xhtml')
                             : null}" />

    </ui:define>
</ui:composition>
