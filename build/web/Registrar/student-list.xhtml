<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:composition template="/template/registrar-layout.xhtml">

        <ui:define name="content">

            <h:form id="studentListForm">

                <!-- ================= MESSAGES ================= -->
                <p:growl id="growl" showDetail="true" />

                <!-- ================= PAGE HEADER ================= -->
                <p:panel styleClass="p-mb-3">

                    <div class="p-grid p-ai-center">
                        <div class="p-col-12 p-md-6">
                            <h2 class="p-m-0">🎓 Student List</h2>
                        </div>

                        <div class="p-col-12 p-md-6 p-text-right">
                            <p:button value="➕ New Student"
                                      outcome="/Registrar/student-management.xhtml"
                                      styleClass="p-button-success" />
                        </div>
                    </div>

                </p:panel>

                <!-- ================= STUDENT TABLE ================= -->
                <p:panel>

                    <p:dataTable id="studentTable"
                                 value="#{studentBean.studentList}"
                                 var="s"
                                 paginator="true"
                                 rows="10"
                                 rowsPerPageTemplate="5,10,20"
                                 emptyMessage="No students found"
                                 reflow="true"
                                 styleClass="p-datatable-sm p-datatable-gridlines">

                        <!-- PHOTO -->
                        <p:column headerText="Photo" style="width:90px; text-align:center">
                            <p:graphicImage value="/resources/uploads/students/#{s.photo}"
                                            width="45"
                                            height="45"
                                            rendered="#{not empty s.photo}" />
                            <h:outputText value="—" rendered="#{empty s.photo}" />
                        </p:column>

                        <!-- STUDENT NO -->
                        <p:column headerText="Student No" sortBy="#{s.studno}">
                            <h:outputText value="#{s.studno}" />
                        </p:column>

                        <!-- SR CODE -->
                        <p:column headerText="SR Code" sortBy="#{s.srcode}">
                            <h:outputText value="#{s.srcode}" />
                        </p:column>

                        <!-- FULL NAME -->
                        <p:column headerText="Full Name" sortBy="#{s.lastname}">
                            <h:outputText
                                value="#{s.lastname}, #{s.firstname} #{s.middlename}" />
                        </p:column>

                        <!-- PROGRAM -->
                        <p:column headerText="Program">
                            <h:outputText value="#{s.program.programName}" />
                        </p:column>

                        <!-- ACTIONS -->
                        <p:column headerText="Actions"
                                  style="width:180px; text-align:center">

                            <p:commandButton icon="pi pi-pencil"
                                             title="Edit"
                                             action="#{studentBean.editStudent(s)}"
                                             styleClass="p-button-rounded p-button-info p-mr-2" />

                            <p:commandButton icon="pi pi-trash"
                                             title="Delete"
                                             styleClass="p-button-rounded p-button-danger"
                                             process="@this"
                                             actionListener="#{studentBean.confirmDelete(s)}"
                                             oncomplete="PF('deleteDialog').show()" />
                        </p:column>

                    </p:dataTable>

                </p:panel>

                <!-- ================= DELETE CONFIRMATION ================= -->
                <p:confirmDialog widgetVar="deleteDialog"
                                 header="⚠ Confirm Deletion"
                                 message="Are you sure you want to delete this student?"
                                 severity="warn"
                                 closable="false">

                    <p:commandButton value="Yes"
                                     icon="pi pi-check"
                                     action="#{studentBean.deleteStudentConfirmed}"
                                     update="studentTable growl"
                                     oncomplete="PF('deleteDialog').hide()"
                                     styleClass="p-button-danger" />

                    <p:commandButton value="No"
                                     icon="pi pi-times"
                                     type="button"
                                     onclick="PF('deleteDialog').hide()"
                                     styleClass="p-button-secondary" />

                </p:confirmDialog>

            </h:form>

        </ui:define>

    </ui:composition>
</html>
