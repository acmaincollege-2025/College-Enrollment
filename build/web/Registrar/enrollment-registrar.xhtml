<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    template="/template/registrar-layout.xhtml">

    <ui:define name="content">

        <h:form id="enrollmentForm" class="p-fluid">

            <!-- ================= ENROLLMENT STATUS ================= -->
            <p:panel styleClass="ui-panel ui-widget ui-widget-content ui-corner-all"
                     style="margin-bottom:20px">

                <h:panelGroup rendered="#{not enrollmentPeriodBean.enrollmentOpen}">
                    <div class="ui-message ui-message-error" style="padding:12px">
                        🚫 <strong>Enrollment Closed</strong> — Please check back later.
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{enrollmentPeriodBean.enrollmentOpen}">
                    <div class="ui-message ui-message-success" style="padding:12px">
                        ✅ <strong>Enrollment Open</strong> — You may proceed with enrollment.
                    </div>
                </h:panelGroup>

            </p:panel>

            <!-- ================= SEARCH & ENROLL ================= -->
            <p:panel header="📝 Registrar Enrollment"
                     rendered="#{enrollmentPeriodBean.enrollmentOpen}"
                     style="margin-bottom:20px">

                <p:messages id="messages" showDetail="true" closable="true" />

                <!-- SEARCH CARD -->
                <div class="p-grid p-ai-center" style="margin-bottom:15px">

                    <div class="p-col-12 p-md-3">
                        <p:selectOneMenu value="#{enrollmentBean.searchBy}">
                            <f:selectItem itemLabel="Search by Last Name" itemValue="lastname" />
                            <f:selectItem itemLabel="Search by Student No." itemValue="studno" />
                        </p:selectOneMenu>
                    </div>

                    <div class="p-col-12 p-md-6">
                        <p:inputText value="#{enrollmentBean.searchKeyword}"
                                     placeholder="Enter keyword…" />
                    </div>

                    <div class="p-col-12 p-md-3">
                        <p:commandButton value="Search"
                                         icon="pi pi-search"
                                         action="#{enrollmentBean.searchStudents}"
                                         update="studentTable"
                                         styleClass="ui-button-info"
                                         style="width:100%" />
                    </div>

                </div>

                <!-- STUDENT TABLE -->
                <p:dataTable id="studentTable"
                             value="#{enrollmentBean.filteredStudents}"
                             var="s"
                             paginator="true"
                             rows="5"
                             selectionMode="single"
                             selection="#{enrollmentBean.selectedStudent}"
                             rowKey="#{s.studno}"
                             emptyMessage="No students found">

                    <p:ajax event="rowSelect"
                            listener="#{enrollmentBean.onStudentSelect}"
                            update="enrollmentDetails" />

                    <p:column headerText="Student No">
                        <h:outputText value="#{s.studno}" />
                    </p:column>

                    <p:column headerText="Student Name">
                        <h:outputText value="#{s.lastname}, #{s.firstname}" />
                    </p:column>

                </p:dataTable>

                <p:separator />

                <!-- ENROLLMENT DETAILS -->
                <p:panel id="enrollmentDetails" header="📄 Enrollment Details">

                    <div class="p-grid">

                        <div class="p-col-12 p-md-6">
                            <strong>Selected Student:</strong><br/>
                            <h:outputText
                                value="#{enrollmentBean.selectedStudent.lastname}, #{enrollmentBean.selectedStudent.firstname}" />
                        </div>

                        <div class="p-col-12 p-md-3">
                            <p:outputLabel value="Academic Year" />
                            <p:inputText value="#{enrollmentBean.enrollment.academic_year}"
                                         placeholder="2024-2025" />
                        </div>

                        <div class="p-col-12 p-md-3">
                            <p:outputLabel value="Semester" />
                            <p:selectOneMenu value="#{enrollmentBean.enrollment.semester}">
                                <f:selectItem itemLabel="Select" itemValue="" />
                                <f:selectItem itemLabel="1st" itemValue="1st" />
                                <f:selectItem itemLabel="2nd" itemValue="2nd" />
                                <f:selectItem itemLabel="Summer" itemValue="Summer" />
                            </p:selectOneMenu>
                        </div>

                    </div>

                    <p:commandButton value="Enroll Student"
                                     icon="pi pi-check"
                                     action="#{enrollmentBean.enrollStudent}"
                                     update="@form"
                                     styleClass="ui-button-success"
                                     style="margin-top:15px" />

                </p:panel>

            </p:panel>

            <!-- ================= ENROLLMENT RECORDS ================= -->
            <p:panel header="📚 Enrollment Records">

                <p:dataTable value="#{enrollmentBean.enrollments}"
                             var="e"
                             paginator="true"
                             rows="10"
                             emptyMessage="No enrollment records found">

                    <p:column headerText="Student No">
                        <h:outputText value="#{e.student.studno}" />
                    </p:column>

                    <p:column headerText="Academic Year">
                        <h:outputText value="#{e.academic_year}" />
                    </p:column>

                    <p:column headerText="Semester">
                        <h:outputText value="#{e.semester}" />
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="#{e.status}" />
                    </p:column>

                </p:dataTable>

            </p:panel>

        </h:form>

    </ui:define>
</ui:composition>
