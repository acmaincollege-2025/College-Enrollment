<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition template="/template/registrar-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="content">

        <h:form id="addDropRegistrarForm">

            <!-- PAGE HEADER -->
            <div class="p-mb-3">
                <h2 class="p-text-bold">📘 Add / Drop Subjects</h2>
                <p class="p-text-secondary">
                    On-site transactions and student add-drop requests
                </p>
            </div>

            <p:tabView dynamic="true" cache="true">

                <!-- ================= TAB 1: ON-SITE ADD/DROP ================= -->
                <p:tab title="🏫 On-Site Add / Drop">

                    <!-- ADD COURSE -->
                    <p:panel header="➕ Add Course" styleClass="p-shadow-2 p-mb-4">

                        <div class="p-grid p-fluid p-ai-end">

                            <div class="p-col-12 p-md-8">
                                <p:panelGrid columns="3">
                                    <p:outputLabel for="courseSelect" value="Available Courses" />

                                    <p:selectOneMenu id="courseSelect"
                                                     value="#{registrarEnrollmentBean.selectedCourseId}">
                                        <f:selectItem itemLabel="Select a course" itemValue="" />
                                        <f:selectItems value="#{registrarEnrollmentBean.availableCourses}"
                                                       var="c"
                                                       itemValue="#{c.courseId}"
                                                       itemLabel="#{c.courseCode} - #{c.courseTitle}" />
                                    </p:selectOneMenu>
                                    <p:commandButton value="Add Course"
                                                     icon="pi pi-plus"
                                                     action="#{registrarEnrollmentBean.addCourse}"
                                                     update="@form"
                                                     styleClass="p-button-success p-mt-3" />
                                </p:panelGrid> 

                            </div>

                        </div>
                    </p:panel>

                    <!-- ENROLLED COURSES -->
                    <p:panel header="📋 Current Enrolled Courses"
                             styleClass="p-shadow-2">

                        <p:dataTable value="#{registrarEnrollmentBean.enrolledCourses}"
                                     var="ec"
                                     rowKey="#{ec.id}"
                                     emptyMessage="No enrolled courses found."
                                     styleClass="p-datatable-striped p-datatable-sm">

                            <p:column headerText="Code" style="width:120px">
                                #{ec.course.courseCode}
                            </p:column>

                            <p:column headerText="Title">
                                #{ec.course.courseTitle}
                            </p:column>

                            <p:column headerText="Units" style="width:80px; text-align:center">
                                #{ec.course.units}
                            </p:column>

                            <p:column headerText="Action"
                                      style="width:90px; text-align:center">
                                <p:commandButton icon="pi pi-trash"
                                                 title="Drop Course"
                                                 action="#{registrarEnrollmentBean.dropCourse(ec.id)}"
                                                 update="@form"
                                                 styleClass="p-button-danger p-button-rounded p-button-sm" />
                            </p:column>

                        </p:dataTable>

                    </p:panel>

                </p:tab>

                <!-- ================= TAB 2: ONLINE ADD-DROP REQUESTS ================= -->
                <p:tab title="📥 Student Requests">

                    <p:panel header="Pending Add-Drop Requests"
                             styleClass="p-shadow-2">

                        <p:dataTable value="#{addDropRegistrarBean.pendingRequests}"
                                     var="r"
                                     rowKey="#{r.requestId}"
                                     emptyMessage="No pending requests."
                                     selectionMode="single"
                                     selection="#{addDropRegistrarBean.selectedRequest}">

                            <p:column headerText="Student No">
                                #{r.student.studentNo}
                            </p:column>

                            <p:column headerText="Student Name">
                                #{r.student.fullName}
                            </p:column>

                            <p:column headerText="Date">
                                <h:outputText value="#{r.requestDate}">
                                    <f:convertDateTime pattern="MMM dd, yyyy" />
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Status">
                                <h:outputText value="#{r.status}"
                                              styleClass="status-badge #{r.status}" />
                            </p:column>

                            <p:column headerText="Action" style="width:120px">
                                <p:commandButton value="View"
                                                 icon="pi pi-eye"
                                                 action="#{addDropRegistrarBean.viewRequest}"
                                                 update=":addDropRegistrarForm:requestDialog"
                                                 oncomplete="PF('reqDlg').show()" />
                            </p:column>

                        </p:dataTable>

                    </p:panel>

                </p:tab>

            </p:tabView>

            <!-- REQUEST DETAILS DIALOG -->
            <p:dialog id="requestDialog"
                      widgetVar="reqDlg"
                      header="Add / Drop Request Details"
                      modal="true"
                      width="700">

                <p:panel header="➕ Courses to Add">
                    <p:dataTable value="#{addDropRegistrarBean.addList}" var="c">
                        <p:column headerText="Code">#{c.courseCode}</p:column>
                        <p:column headerText="Title">#{c.courseTitle}</p:column>
                        <p:column headerText="Units">#{c.units}</p:column>
                    </p:dataTable>
                </p:panel>

                <p:panel header="➖ Courses to Drop" styleClass="p-mt-3">
                    <p:dataTable value="#{addDropRegistrarBean.dropList}" var="c">
                        <p:column headerText="Code">#{c.courseCode}</p:column>
                        <p:column headerText="Title">#{c.courseTitle}</p:column>
                    </p:dataTable>
                </p:panel>

                <div class="p-text-right p-mt-3">
                    <p:commandButton value="Approve"
                                     icon="pi pi-check"
                                     action="#{addDropRegistrarBean.approve}"
                                     update="@form"
                                     styleClass="p-button-success" />

                    <p:commandButton value="Reject"
                                     icon="pi pi-times"
                                     action="#{addDropRegistrarBean.reject}"
                                     update="@form"
                                     styleClass="p-button-danger p-ml-2" />
                </div>

            </p:dialog>

        </h:form>

    </ui:define>
</ui:composition>
