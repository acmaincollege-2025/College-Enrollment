<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template/layout-dean.xhtml">

        <ui:define name="content">

            <h:form id="deanReportForm">

                <p:panel header="Enrollment Report Filters" styleClass="ui-card">

                    <p:panelGrid columns="6" layout="grid"
                                 columnClasses="ui-g-12 ui-md-4,
                                 ui-g-12 ui-md-4,
                                 ui-g-12 ui-md-4">

                        <h:panelGroup>
                            <h:outputLabel value="Year" />
                            <p:selectOneMenu value="#{enrollmentBean.selectedAcademicYear}"
                                             style="width:100%">
                                <f:selectItem itemLabel="All Years" itemValue="" />
                                <f:selectItem itemLabel="1st Year" itemValue="1" />
                                <f:selectItem itemLabel="2nd Year" itemValue="2" />
                                <f:selectItem itemLabel="3rd Year" itemValue="3" />
                                <f:selectItem itemLabel="4th Year" itemValue="4" />
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <h:outputLabel value="Semester" />
                            <p:selectOneMenu value="#{enrollmentBean.selectedSemester}" style="width:100%">
                                <f:selectItem itemLabel="Select Semester" itemValue="" />
                                <f:selectItem itemLabel="1st" itemValue="1st" />
                                <f:selectItem itemLabel="2nd" itemValue="2nd" />
                                <f:selectItem itemLabel="Summer" itemValue="Summer" />
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup>
                            <h:outputLabel value="Program" />
                            <p:selectOneMenu value="#{enrollmentBean.selectedStudent.programId}" style="width:100%">
                                <f:selectItem itemLabel="Select Program" itemValue="" />
                                <f:selectItems value="#{programBean.programList}"
                                               var="p"
                                               itemLabel="#{p.program_name}"
                                               itemValue="#{p.program_code}" />
                            </p:selectOneMenu>
                        </h:panelGroup>
                    </p:panelGrid>

                    <p:separator />

                    <!-- ACTION BUTTONS -->
                    <p:panelGrid columns="2" style="width:100%">
                        <p:commandButton value="Generate Report"
                                         icon="pi pi-search"
                                         action="#{enrollmentBean.loadDeanReport}"
                                         update="reportTable"
                                         styleClass="ui-button-primary" />

                        <p:commandButton value="Reset"
                                         icon="pi pi-refresh"
                                         process="@this"
                                         actionListener="#{enrollmentBean.reset}"
                                         update="@form" />
                    </p:panelGrid>

                </p:panel>

                <!-- REPORT TABLE -->
                <p:dataTable id="reportTable"
                             value="#{enrollmentBean.deanEnrollments}"
                             var="e"
                             paginator="true"
                             rows="10"
                             style="margin-top:1rem;width:100%">

                    <p:column headerText="Student Name">
                        #{e.student.fullName}
                    </p:column>

                    <p:column headerText="Program">
                        #{e.programName}
                    </p:column>

                    <p:column headerText="Year">
                        #{e.yearLevel}
                    </p:column>

                    <p:column headerText="Semester">
                        #{e.semester}
                    </p:column>

                    <p:column headerText="Status">
                        #{e.status}
                    </p:column>

                </p:dataTable>

            </h:form>


        </ui:define>
    </ui:composition>
</html>
