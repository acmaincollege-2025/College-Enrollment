<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <title>Student Portal</title>

        <!-- Custom minimal styling -->
        <style type="text/css">
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f4f6f9;
            }

            .layout-wrapper {
                display: table;
                width: 100%;
                height: 100vh;
            }

            .sidebar {
                display: table-cell;
                width: 230px;
                background-color: #1f2933;
                color: #fff;
                vertical-align: top;
            }

            .sidebar h2 {
                padding: 15px;
                margin: 0;
                font-size: 18px;
                background-color: #111827;
                text-align: center;
            }

            .sidebar a {
                display: block;
                padding: 12px 18px;
                color: #d1d5db;
                text-decoration: none;
                font-size: 14px;
            }

            .sidebar a:hover {
                background-color: #374151;
                color: #fff;
            }

            .content-wrapper {
                display: table-cell;
                vertical-align: top;
            }

            .topbar {
                background-color: #ffffff;
                padding: 10px 20px;
                border-bottom: 1px solid #ddd;
            }

            .content {
                padding: 20px;
            }

            .footer {
                padding: 10px;
                font-size: 12px;
                text-align: center;
                color: #777;
            }
        </style>
        <f:metadata>
            <f:event type="preRenderView" listener="#{loginBean.checkSession}" />
        </f:metadata>
    </h:head>

    <h:body>
        <h:form>
            <p:idleMonitor timeout="900000"> <!-- 15 minutes -->
                <p:ajax event="idle" listener="#{loginBean.log_out}" />
            </p:idleMonitor>
        </h:form>
        <div class="layout-wrapper">

            <!-- ================= SIDEBAR ================= -->
            <div class="sidebar">

                <h2>🎓 Student</h2>

                <h:form>
                    <p:commandLink value="🏠 Dashboard"
                                   action="student-dashboard?faces-redirect=true"
                                   styleClass="ui-link"/>

                    <p:commandLink value="📝 Enrollment"
                                   action="student-enrollment?faces-redirect=true"
                                   styleClass="ui-link"/>

                    <p:commandLink value="💳 Payments"
                                   action="payment?faces-redirect=true"
                                   styleClass="ui-link"/>

                    <p:commandLink value="📊 Grades"
                                   action="student_grades?faces-redirect=true"
                                   styleClass="ui-link"/>

                    <p:commandLink value="✏️ Edit Profile"
                                   action="student-edit?faces-redirect=true"
                                   styleClass="ui-link"/>

                    <p:separator/>

                    <p:commandLink value="🚪 Logout"
                                   action="#{loginBean.logout}"
                                   styleClass="ui-link"/>
                </h:form>

            </div>

            <!-- ================= MAIN AREA ================= -->
            <div class="content-wrapper">

                <!-- TOP BAR -->
                <div class="topbar">
                    <h:outputText
                        value="Welcome, #{studentBean.loggedInStudent.firstname}"
                        style="font-weight:bold"/>
                </div>

                <!-- PAGE CONTENT -->
                <div class="content">
                    <ui:insert name="content"/>
                </div>

                <!-- FOOTER -->
                <div class="footer">
                    © #{java.time.Year.now().value} College Enrollment System
                </div>

            </div>

        </div>
        <ui:fragment rendered="#{loginBean.loggedInUser.role eq 'STUDENT'}">
            <ui:include src="/widgets/studentFloatingChatWidget.xhtml"/>
        </ui:fragment>

    </h:body>
</html>
