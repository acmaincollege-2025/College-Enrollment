<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/template/layout-cashier.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="content">

        <h2>Payment History</h2>

        <h:form id="historyForm">

            <p:panel header="Filter Payments">

                <p:calendar value="#{cashierPaymentHistoryBean.startDate}"
                            pattern="yyyy-MM-dd"
                            placeholder="Start Date"/>

                <p:calendar value="#{cashierPaymentHistoryBean.endDate}"
                            pattern="yyyy-MM-dd"
                            placeholder="End Date"/>

                <p:inputText value="#{cashierPaymentHistoryBean.selectedProgram}"
                             placeholder="Program"/>

                <p:inputText value="#{cashierPaymentHistoryBean.cashierName}"
                             placeholder="Cashier Name"/>

                <p:commandButton value="Filter"
                                 action="#{cashierPaymentHistoryBean.filterPayments}"
                                 update="historyTable totalPanel"/>

            </p:panel>

            <br/>

            <p:dataTable id="historyTable"
                         value="#{cashierPaymentHistoryBean.filteredPayments}"
                         var="payment">

                <p:column headerText="Student No">
                    #{payment.studentNo}
                </p:column>

                <p:column headerText="Amount">
                    ₱#{payment.amountPaid}
                </p:column>

                <p:column headerText="Date">
                    #{payment.paymentDate}
                </p:column>

                <p:column headerText="Type">
                    #{payment.paymentType}
                </p:column>

            </p:dataTable>

            <br/>

            <p:panel id="totalPanel">
                <h3>Total Collected: ₱#{cashierPaymentHistoryBean.totalAmount}</h3>
            </p:panel>

        </h:form>

    </ui:define>
</ui:composition>
