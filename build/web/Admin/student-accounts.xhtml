<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/template/admin-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <f:event type="preRenderView"
             listener="#{loginBean.checkAdminAccess}" />

    <ui:define name="content">

        <h2>Student Account Management</h2>
        <h:form id="messageForm">
            <p:messages id="msgs" closable="true" />
        </h:form>


        <br/><br/>

        <!-- TABLE -->
        <h:form id="tableForm">
            <!-- ADD BUTTON -->
            <p:commandButton value="+ Add Student"             
                             oncomplete="PF('addDlg').show()" />

            <p:dataTable id="studentTable"
                         value="#{adminStudentCredentialBean.credentials}"
                         var="s"
                         selection="#{adminStudentCredentialBean.selected}"
                         selectionMode="single"
                         rowKey="#{s.id}"
                         paginator="true"
                         rows="10">

                <p:column headerText="Student No">#{s.studentNo}</p:column>
                <p:column headerText="Role">#{s.role}</p:column>
                <p:column headerText="Status">#{s.status}</p:column>
                <p:column headerText="Last Login">#{s.lastLogin}</p:column>

                <p:column headerText="Actions">
                    <p:commandButton value="✏️ Edit" title="Edit"
                                     update=":editForm"
                                     oncomplete="PF('editDlg').show()" />

                    <p:commandButton value="🔄 Reset Password"
                                     title="Reset Password"
                                     action="#{adminStudentCredentialBean.resetPassword}"
                                     oncomplete="PF('passwordDlg').show()" />


                    <p:commandButton value="🗑️ Remove" title="Delete"
                                     action="#{adminStudentCredentialBean.delete}"
                                     update="studentTable"
                                     styleClass="ui-button-danger"/>
                </p:column>

            </p:dataTable>
        </h:form>

        <!-- ADD DIALOG -->
        <p:dialog header="Add Student"
                  widgetVar="addDlg"
                  modal="true">

            <h:form>


                <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">

                    <p:outputLabel value="Student No"/>
                    <p:inputText value="#{adminStudentCredentialBean.newCredential.studentNo}"
                                 required="true"/>

                    <p:outputLabel value="Status"/>
                    <p:selectOneMenu value="#{adminStudentCredentialBean.newCredential.status}">
                        <f:selectItem itemLabel="Active" itemValue="active"/>
                        <f:selectItem itemLabel="Inactive" itemValue="inactive"/>
                    </p:selectOneMenu>

                </p:panelGrid>

                <p:commandButton value=" 💾 Save"
                                 action="#{adminStudentCredentialBean.add}"
                                 update=":tableForm :passwordForm :messageForm:msgs"
                                 oncomplete="if (#{adminStudentCredentialBean.created}) {
                                 PF('addDlg').hide();
                                 PF('passwordDlg').show();
                                 }" />


            </h:form>
        </p:dialog>

        <!-- EDIT DIALOG -->
        <p:dialog header="Edit Student"
                  widgetVar="editDlg"
                  modal="true">

            <h:form id="editForm">
                <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">

                    <p:outputLabel value="Student No"/>
                    <p:inputText value="#{adminStudentCredentialBean.selected.studentNo}" disabled="true"/>

                    <p:outputLabel value="Role"/>
                    <p:selectOneMenu value="#{adminStudentCredentialBean.selected.role}">
                        <f:selectItem itemLabel="Student" itemValue="student"/>
                        <f:selectItem itemLabel="Admin" itemValue="admin"/>
                    </p:selectOneMenu>

                    <p:outputLabel value="Status"/>
                    <p:selectOneMenu value="#{adminStudentCredentialBean.selected.status}">
                        <f:selectItem itemLabel="Active" itemValue="active"/>
                        <f:selectItem itemLabel="Inactive" itemValue="inactive"/>
                    </p:selectOneMenu>

                </p:panelGrid>

                <p:commandButton value=" 💾 Update"
                                 action="#{adminStudentCredentialBean.update}"
                                 update=":tableForm"
                                 oncomplete="PF('editDlg').hide()"/>

            </h:form>
        </p:dialog>
        <p:dialog header="Student Account Created"
                  widgetVar="passwordDlg"
                  modal="true"
                  closable="false">

            <h:form id="passwordForm">

                <h:panelGrid columns="1" style="text-align:center">

                    <h:outputText value="Temporary Password"
                                  style="font-weight:bold"/>

                    <h:outputText value="#{adminStudentCredentialBean.generatedPassword}"
                                  style="font-size:18px;color:#d32f2f;font-weight:bold"/>

                    <h:outputText value="Copy this password now. It will not be shown again."
                                  style="font-size:12px;color:gray"/>

                    <p:commandButton value=" 📋 I have copied it"
                                     icon="pi pi-check"
                                     onclick="PF('passwordDlg').hide()"/>
                </h:panelGrid>

            </h:form>
        </p:dialog>


    </ui:define>
</ui:composition>
